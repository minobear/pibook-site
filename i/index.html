<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拍簿邀請碼 — Pibook</title>
<meta name="robots" content="noindex">
<meta name="description" content="朋友邀請你一起用拍簿整理照片。下載後登入並輸入邀請碼，你們都能免費多用 Premium。">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171E25" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="拍簿 Pibook">
<meta property="og:title" content="拍簿邀請碼">
<meta property="og:description" content="下載拍簿、登入並輸入邀請碼，你和朋友都能免費多用 Premium。">
<meta property="og:image" content="https://pibook.app/assets/app_icon.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/assets/app_icon.png">
<style>
/*
 * 邀請頁（2026-09-29）—— 朋友分享出去的連結落在這裡：https://pibook.app/i/?c=K7M2Q
 *
 * 一頁只做兩件事：讓他看清楚那組碼（可以複製），以及把他送到對的商店。
 * 下載之後要在哪裡輸入，照 App 裡真正的字寫出來。
 *
 * ⚠️ 參數叫 c，不叫 code：App 端的 supabase_flutter 會把帶 code= 的連結當成
 *    登入回呼吃掉。
 * ⚠️ 字元表與 App（lib/core/entitlement/invite_code.dart）、伺服器（migration
 *    20260929000000 的 CHECK）必須一模一樣 —— App 的守門測試會比對這個檔案。
 * ⚠️ 自己一頁、不走 build.py 的中英切換：邀請頁要五種語言，依瀏覽器語言挑。
 *
 * 這份的正本在主 repo 的 site_drafts/i/index.html；上線的是官網 repo
 * （minobear/pibook-site）的 i/index.html —— 改一邊要同步另一邊。
 */
:root {
  --ground: #FBF7F0; --surface: #FFFFFF; --sunken: #F4EFE6; --line: #E6DED1;
  --ink: #2A3744; --ink-soft: #5C6A78; --ink-fade: #93A0AC;
  --gold: #C2772E; --gold-wash: #FBF1E6; --coral: #C75F4E;
  --radius: 22px;
  --sans: "PingFang TC", "Noto Sans TC", "Hiragino Sans", "Apple SD Gothic Neo", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #171E25; --surface: #212B34; --sunken: #1B242C; --line: #33404C;
    --ink: #E9E3D8; --ink-soft: #AAB6C1; --ink-fade: #7C8894;
    --gold: #F0C094; --gold-wash: #2E2A24; --coral: #F09885;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); }
main { max-width: 440px; margin: 0 auto; padding: 40px 20px 48px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand span { font-weight: 700; font-size: 18px; letter-spacing: .02em; }
h1 { font-size: 26px; line-height: 1.35; margin: 0 0 8px; }
.lead { color: var(--ink-soft); font-size: 16px; line-height: 1.6; margin: 0 0 24px; }
.ticket {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; text-align: center;
}
.ticket .label { color: var(--ink-soft); font-size: 14px; margin-bottom: 8px; }
.code {
  font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 700; letter-spacing: .28em;
  color: var(--gold); padding-left: .28em; user-select: all; -webkit-user-select: all;
}
.code.missing { color: var(--ink-fade); letter-spacing: .2em; }
.copy {
  margin-top: 12px; border: 1px solid var(--line); background: var(--sunken); color: var(--ink);
  border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit;
}
.copied { color: var(--ink-soft); font-size: 13px; min-height: 18px; margin-top: 6px; }
.cta {
  display: block; width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 16px;
  background: var(--coral); color: #fff; font-size: 17px; font-weight: 700; text-align: center;
  text-decoration: none; cursor: pointer; font-family: inherit;
}
.stores { display: flex; gap: 10px; margin-top: 12px; }
.stores a {
  flex: 1; text-align: center; padding: 12px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); text-decoration: none; font-size: 14px;
}
/* 還沒有 App Store 網址、又不在 iPhone 上：只是一句「去哪裡找」，不是按鈕。 */
.stores a.note { border-style: dashed; background: transparent; color: var(--ink-soft); font-size: 13px; }
.steps { margin: 28px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { position: relative; padding: 0 0 14px 34px; line-height: 1.6; color: var(--ink-soft); counter-increment: s; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%;
  background: var(--gold-wash); color: var(--gold); font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.fine { margin-top: 20px; color: var(--ink-fade); font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/assets/app_icon.png" alt=""><span data-t="brand">拍簿</span></div>
  <h1 data-t="title">朋友邀請你一起用拍簿</h1>
  <p class="lead" data-t="lead">下載拍簿、登入之後輸入這組邀請碼，你和朋友都能免費多用 Premium。</p>

  <div class="ticket">
    <div class="label" data-t="codeLabel">邀請碼</div>
    <div class="code" id="code">•••••</div>
    <button type="button" class="copy" id="copy" data-t="copy">複製邀請碼</button>
    <div class="copied" id="copied" aria-live="polite"></div>
  </div>

  <a class="cta" id="go" href="#" data-t="go">複製邀請碼並前往下載</a>
  <div class="stores">
    <a id="ios" href="#" data-t="ios">App Store</a>
    <a id="android" href="#" data-t="android">Google Play</a>
  </div>

  <ol class="steps">
    <li data-t="step1">下載並打開拍簿，登入你的帳號。</li>
    <li data-t="step2">點首頁分頁列右邊的「賺 Premium」。</li>
    <li data-t="step3">點「輸入邀請碼」，貼上或輸入這組碼。</li>
  </ol>
  <p class="fine" data-t="fine">每個帳號可以使用一次邀請碼。邀請碼沒有現金價值。</p>
</main>
<script>
(function () {
  'use strict';

  // ⚠️ 與 App 的 kInviteAlphabet、伺服器的 CHECK 一模一樣（守門測試會比對）。
  var ALPHABET = '23456789BCDFGHJKMNPQRSTVWXYZ';
  var PACKAGE = 'com.minobear.pibook';
  // 拿到 App Store 的數字 ID 之後填這裡：'https://apps.apple.com/app/id<數字>'。
  // 在那之前 iPhone 導向 App Store 搜尋（與 App 內更新牆同一個退路）。
  var APP_STORE_URL = '';

  var T = {
    'zh-Hant': {
      brand: '拍簿', title: '朋友邀請你一起用拍簿',
      lead: '下載拍簿、登入之後輸入這組邀請碼，你和朋友都能免費多用 Premium。',
      codeLabel: '邀請碼', copy: '複製邀請碼', copied: '已複製邀請碼',
      go: '複製邀請碼並前往下載', ios: 'App Store', android: 'Google Play',
      step1: '下載並打開拍簿，登入你的帳號。',
      step2: '點首頁分頁列右邊的「賺 Premium」。',
      step3: '點「輸入邀請碼」，貼上或輸入這組碼。',
      fine: '每個帳號可以使用一次邀請碼。邀請碼沒有現金價值。',
      missing: '這個連結裡沒有邀請碼。請向朋友再要一次，或直接下載拍簿。',
      iosSearch: 'App Store 搜尋「拍簿」'
    },
    'zh-Hans': {
      brand: '拍簿', title: '朋友邀请你一起用拍簿',
      lead: '下载拍簿、登录之后输入这组邀请码，你和朋友都能免费多用 Premium。',
      codeLabel: '邀请码', copy: '复制邀请码', copied: '已复制邀请码',
      go: '复制邀请码并前往下载', ios: 'App Store', android: 'Google Play',
      step1: '下载并打开拍簿，登录你的账号。',
      step2: '点首页标签栏右边的「赚 Premium」。',
      step3: '点「输入邀请码」，粘贴或输入这组码。',
      fine: '每个账号可以使用一次邀请码。邀请码没有现金价值。',
      missing: '这个链接里没有邀请码。请向朋友再要一次，或直接下载拍簿。',
      iosSearch: 'App Store 搜索「拍簿」'
    },
    en: {
      brand: 'Pibook', title: 'A friend invited you to Pibook',
      lead: 'Download Pibook, sign in and enter this invite code, and you and your friend both get extra days of Premium for free.',
      codeLabel: 'Invite code', copy: 'Copy code', copied: 'Invite code copied',
      go: 'Copy code and download', ios: 'App Store', android: 'Google Play',
      step1: 'Download and open Pibook, then sign in.',
      step2: 'Tap “Earn Premium” at the right of the Home tab bar.',
      step3: 'Tap “Enter code” and paste or type this code.',
      fine: 'Each account can redeem one invite code. Invite codes have no cash value.',
      missing: 'This link has no invite code. Ask your friend for it again, or just download Pibook.',
      iosSearch: 'Search “Pibook” in the App Store'
    },
    ja: {
      brand: 'Pibook', title: '友だちから Pibook への招待',
      lead: 'Pibook をダウンロードしてサインインし、この招待コードを入力すると、お互いに Premium が無料で付きます。',
      codeLabel: '招待コード', copy: 'コードをコピー', copied: '招待コードをコピーしました',
      go: 'コードをコピーしてダウンロード', ios: 'App Store', android: 'Google Play',
      step1: 'Pibook をダウンロードして開き、サインインします。',
      step2: 'ホームのタブバー右側の「Premium を獲得」をタップします。',
      step3: '「コードを入力」をタップして、このコードを貼り付けます。',
      fine: '招待コードは 1 つのアカウントにつき 1 回使えます。換金はできません。',
      missing: 'このリンクには招待コードがありません。友だちにもう一度聞くか、そのまま Pibook をダウンロードしてください。',
      iosSearch: 'App Store で「Pibook」を検索'
    },
    ko: {
      brand: 'Pibook', title: '친구가 Pibook에 초대했어요',
      lead: 'Pibook을 다운로드해서 로그인한 뒤 이 초대 코드를 입력하면 나와 친구 모두 Premium을 무료로 더 받아요.',
      codeLabel: '초대 코드', copy: '코드 복사', copied: '초대 코드를 복사했어요',
      go: '코드 복사하고 다운로드', ios: 'App Store', android: 'Google Play',
      step1: 'Pibook을 다운로드해 열고 로그인하세요.',
      step2: '홈 탭 바 오른쪽의 「Premium 받기」를 누르세요.',
      step3: '「코드 입력」을 누르고 이 코드를 붙여넣으세요.',
      fine: '초대 코드는 계정마다 한 번 사용할 수 있어요. 현금 가치는 없어요.',
      missing: '이 링크에는 초대 코드가 없어요. 친구에게 다시 받거나 바로 Pibook을 다운로드하세요.',
      iosSearch: 'App Store에서 「Pibook」 검색'
    }
  };

  function pickLang() {
    var langs = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).toLowerCase();
      if (l.indexOf('zh') === 0) {
        if (l.indexOf('hans') >= 0 || l === 'zh-cn' || l === 'zh-sg') return 'zh-Hans';
        return 'zh-Hant';
      }
      if (l.indexOf('ja') === 0) return 'ja';
      if (l.indexOf('ko') === 0) return 'ko';
      if (l.indexOf('en') === 0) return 'en';
    }
    return 'en';
  }

  // 與 App 的 normalizeInviteInput 同一套：全形轉半形、轉大寫、只留英數字。
  function normalize(raw) {
    var s = String(raw || '').replace(/[！-～]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
    return s.toUpperCase().replace(/[^0-9A-Z]/g, '');
  }

  function isValid(code) {
    if (code.length !== 5) return false;
    for (var i = 0; i < code.length; i++) {
      if (ALPHABET.indexOf(code[i]) < 0) return false;
    }
    return /[2-9]/.test(code) && /[B-Z]/.test(code);
  }

  var lang = pickLang();
  var t = T[lang];
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-t]');
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute('data-t');
    if (t[key]) nodes[i].textContent = t[key];
  }
  document.title = t.codeLabel + ' — ' + (lang.indexOf('zh') === 0 ? '拍簿 Pibook' : 'Pibook');

  var params = new URLSearchParams(location.search);
  var code = normalize(params.get('c'));
  var codeEl = document.getElementById('code');
  var copyBtn = document.getElementById('copy');
  var copiedEl = document.getElementById('copied');
  var valid = isValid(code);
  if (valid) {
    codeEl.textContent = code;
  } else {
    codeEl.className = 'code missing';
    copyBtn.style.display = 'none';
    document.querySelector('.lead').textContent = t.missing;
  }

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var playUrl = 'https://play.google.com/store/apps/details?id=' + PACKAGE +
    '&referrer=' + encodeURIComponent('utm_source=invite' + (valid ? '&utm_content=' + code : ''));
  var iosUrl = APP_STORE_URL || 'itms-apps://itunes.apple.com/search?term=Pibook&entity=software';

  var iosLink = document.getElementById('ios');
  document.getElementById('android').href = playUrl;
  if (APP_STORE_URL || isIOS) {
    iosLink.href = iosUrl;
  } else {
    // 桌機上又還沒有 App Store 的頁面網址 —— 講清楚要去哪裡找，不給一個點了沒反應的連結。
    iosLink.removeAttribute('href');
    iosLink.className = 'note';
    iosLink.textContent = t.iosSearch;
  }

  function copyCode() {
    if (!valid) return Promise.resolve(false);
    function fallback() {
      // App 內建瀏覽器（LINE、Messenger）常常沒有 clipboard API。
      var ta = document.createElement('textarea');
      ta.value = code;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
    var p = (navigator.clipboard && navigator.clipboard.writeText)
      ? navigator.clipboard.writeText(code).then(function () { return true; }, fallback)
      : Promise.resolve(fallback());
    return p.then(function (ok) {
      if (ok) copiedEl.textContent = t.copied;
      return ok;
    });
  }

  copyBtn.addEventListener('click', copyCode);

  var go = document.getElementById('go');
  go.href = isAndroid ? playUrl : (isIOS ? iosUrl : '#');
  go.addEventListener('click', function (e) {
    e.preventDefault();
    // 先複製、再走 —— 不自動跳轉：一進來就被送走，他連碼都沒看到。
    copyCode().then(function () {
      if (isAndroid) location.href = playUrl;
      else if (isIOS) location.href = iosUrl;
      else document.querySelector('.stores').scrollIntoView({ behavior: 'smooth' });
    });
  });
})();
</script>
</body>
</html>
