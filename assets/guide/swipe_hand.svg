<!--
  上滑手勢的手 —— 教「這裡可以往上滑」時，畫面中央那隻正在滑動的手。

  為什麼是手不是箭頭：箭頭是符號，看到的人要先翻譯一次；手是動作本身，
  誰都不用學。短影音類 App 的上滑提示幾乎都是這個語彙。

  ⚠️ 這張圖改過一次。第一版把食指畫成**筆直朝上、正對著一個左右對稱的拳頭**，
  實機一看就是在比中指。教訓：判斷一隻手的手勢，人看的是整體姿態不是單一手指。
  現在靠四件事讓它讀成「正在滑螢幕的手」：
  - 整隻手**傾斜**（右下往左上），不是正立
  - 食指**短而斜**，不是又長又直的旗桿
  - 拇指是一塊明顯的外突，不是拳頭邊緣的小凸點
  - 底部帶**手腕**，有手腕才是手，沒手腕就只是一團拳頭

  白線下方壓一層半透明黑線當底：使用者的照片可能是白牆也可能是夜景，
  只有白線的話總有一種會消失。線寬與指節弧度刻意不完全對稱（手繪感，
  與 mascot / stamp 同一套語言）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <g transform="rotate(-13 64 72)">
    <!-- 底：深色描邊（亮照片上的可讀性） -->
    <path d="M45 30
             Q44 19 53 17.5
             Q62 16 63.5 27
             L67 58
             Q73 53 80 58
             Q89 57 92 66
             Q99 71 99 81
             L99 93
             Q99 104 91 108
             L89 119
             L59 119
             L56.5 108
             Q44 105 40 95
             L36 83
             Q25 81 24.5 72
             Q24 63 33 63
             Q41 63 45 71
             Z"
          stroke="#12181F" stroke-opacity="0.42" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 面：極淡的白，讓手在深色照片上有一點量體，不是空心線稿 -->
    <path d="M45 30
             Q44 19 53 17.5
             Q62 16 63.5 27
             L67 58
             Q73 53 80 58
             Q89 57 92 66
             Q99 71 99 81
             L99 93
             Q99 104 91 108
             L89 119
             L59 119
             L56.5 108
             Q44 105 40 95
             L36 83
             Q25 81 24.5 72
             Q24 63 33 63
             Q41 63 45 71
             Z"
          fill="#FFFFFF" fill-opacity="0.17"/>

    <!-- 外框 -->
    <path d="M45 30
             Q44 19 53 17.5
             Q62 16 63.5 27
             L67 58
             Q73 53 80 58
             Q89 57 92 66
             Q99 71 99 81
             L99 93
             Q99 104 91 108
             L89 119
             L59 119
             L56.5 108
             Q44 105 40 95
             L36 83
             Q25 81 24.5 72
             Q24 63 33 63
             Q41 63 45 71
             Z"
          stroke="#FFFFFF" stroke-width="5.2"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 手腕那道分界（有這條才看得出「手掌到這裡為止」） -->
    <path d="M57 107 Q73 111 89 107" stroke="#FFFFFF" stroke-width="4"
          stroke-linecap="round" stroke-opacity="0.62"/>

    <!-- 收起的兩指：只給折痕，長度與弧度刻意不一樣 -->
    <path d="M71 63 Q77 68 78 76" stroke="#FFFFFF" stroke-width="4.4"
          stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M84 68 Q89 73 89.5 80" stroke="#FFFFFF" stroke-width="4"
          stroke-linecap="round" stroke-opacity="0.76"/>
  </g>
</svg>
