<!--
  相片角貼 —— 貼在鏤空四角，讓「被聚光的東西」讀起來像被安裝在相簿頁上的照片，
  而不是被軟體框起來的 UI 元件。

  只畫左上角那一片；另外三角在程式端旋轉 90/180/270 度重用（與 mascot 同思路：
  一套幾何、多個姿勢）。

  刻意的不完美：斜邊不是直線而是極輕微的弧，兩端的收口也不對稱 —— 手工裁切的
  紙角本來就不會是完美的等腰三角形。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="paperFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EFE7DA"/>
    </linearGradient>
  </defs>

  <!-- 落在照片上的接觸陰影（實體形狀，不用 filter） -->
  <path d="M4 6 L44 6 Q46.5 6.2 44.4 8.2 L8.6 45 Q6.4 47.2 6 44.6 Z"
        fill="#2A3744" opacity="0.13"/>

  <!-- 紙角本體：斜邊微弧、兩端收口不對稱 -->
  <path d="M3 4 L43 4 Q45.5 4.2 43.2 6.4 Q24 25 6.4 43.6 Q4.2 45.8 4 43 Z"
        fill="url(#paperFace)"/>

  <!-- 斜邊的摺線高光（紙被折起來的那一道） -->
  <path d="M43 4.6 Q24 24.6 4.8 43.4"
        stroke="#FFFFFF" stroke-width="2" opacity="0.75" stroke-linecap="round"/>

  <!-- 外緣一圈極淡的紙緣，讓角貼在深色遮罩上也讀得出來 -->
  <path d="M3 4 L43 4 Q45.5 4.2 43.2 6.4 Q24 25 6.4 43.6 Q4.2 45.8 4 43 Z"
        stroke="#D9CFBE" stroke-width="1.2" opacity="0.9"/>
</svg>
