<!-- 全站共用頁首。這是唯一的一份 —— 改這裡，跑 `python build.py`，
     每一頁的 @partial:header 區塊就會一起換掉。不要直接改頁面裡展開後的內容。 -->
<header class="site-header">
  <div class="inner">
    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/app_icon.png" alt="" aria-hidden="true">
      <span class="brand-words">
        <span class="mark zh">拍簿</span>
        <span class="mark en">Pibook</span>
        <span class="latin zh">PIBOOK</span>
      </span>
    </a>
    <div class="lang-toggle">
      <button type="button" data-lang="zh" aria-pressed="true">繁體中文</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
</header>
