<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截圖 03 — 相似照片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="../../assets/phone.css">
<link rel="stylesheet" href="../press.css">
<style>:root{--pb-sans:"Noto Sans KR", sans-serif;--pb-serif:"Noto Sans KR", sans-serif}</style>
</head>
<body>
<div class="board">

  <div class="copy">
    <div class="kicker">비슷한 사진</div>
    <h1>비슷한 사진을<br>알아서 찾아요</h1>
    <p class="sub">연사와 다시 찍은 사진을 한데 모아요<br>남길 사진은 직접 고르세요</p>
  </div>

  <!-- 原版那張特寫（三張一組），這一版改成三組完整、卡片放大 -->
  <div class="stage stage--panel" style="padding-top:26px">
    <svg class="spark" style="left:5%;top:0" width="24" height="24" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
    <svg class="spark" style="right:4%;top:56%" width="15" height="15" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>

    <div class="panel-wrap">
      <div class="uipanel uipanel--wide">
        <img src="../../assets/shots/ko/similar_groups_hd.jpg" alt="相似照片：連拍自動排成一組，星號標出推薦留下的那張">
      </div>
      <!-- 拍拍舉放大鏡，掛在特寫卡右上（蓋住第一組的全刪／保留，同原版） -->
      <img class="mascot" src="../../assets/mascot/pipi_magnifier.webp" alt="拍拍"
           style="right:-4px;top:-46px;width:116px;transform:rotate(-5deg)">
    </div>

    <div class="float-chip" style="position:relative;margin-top:-26px;z-index:6">
      <svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#C75F4E"/></svg>
      베스트 자동 선택 · 7묶음
    </div>
  </div>
</div>
<script src="../press.js"></script>

</html>
