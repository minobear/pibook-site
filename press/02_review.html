<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截圖 02 — 整理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/phone.css">
<link rel="stylesheet" href="press.css">
</head>
<body>
<div class="board">

  <div class="copy">
    <div class="kicker">整理</div>
    <h1>左滑刪、右滑留<br>相簿一張張變乾淨</h1>
    <p class="sub">一次一小輪就好，進度隨時記住</p>
  </div>

  <div class="stage">
    <!-- 星芒 -->
    <svg class="spark" style="left:5%;top:5%" width="26" height="26" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
    <svg class="spark" style="right:5%;top:30%" width="16" height="16" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>

    <div class="phone-fit"><div class="phone"><div class="scr">
      <div class="sb">
        <span>9:41</span>
        <svg width="64" height="14" viewBox="0 0 64 14" fill="currentColor"><rect y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="4" width="3" height="9" rx="1"/><rect x="15" y="2" width="3" height="11" rx="1"/><path d="M28 7a7.5 7.5 0 0 1 9.4 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M30.3 9.7a4 4 0 0 1 4.8 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="32.7" cy="12" r="1.3"/><rect x="45" y="2.5" width="16" height="9" rx="3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="47" y="4.5" width="9" height="5" rx="1.5"/><rect x="62" y="5.2" width="2" height="3.6" rx="1"/></svg>
      </div>

      <div class="rv-top">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4 6.5 10l6 6" stroke="#2A3744" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="rng">8月 24 日 – 今天</span>
        <span class="cnt">本輪 12 / 30</span>
      </div>
      <div class="rv-bar"><i style="width:40%"></i></div>

      <div class="rv-stage">
        <div class="rv-card rv-card--u3"><div class="photo scene scene--field"></div></div>
        <div class="rv-card rv-card--u2"><div class="photo scene scene--sea"></div></div>
        <div class="rv-card rv-card--top">
          <div class="photo scene scene--dusk"></div>
          <div class="stamp-keep">保留</div>
          <div class="rv-date">8月 26 日 · 台東</div>
          <img src="../assets/guide/swipe_hand.svg" alt="" style="position:absolute;right:44px;bottom:104px;width:72px;transform:rotate(62deg)">
        </div>
      </div>

      <div class="rv-actions">
        <div class="rv-btn rv-btn--undo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 14 4 9.5 9 5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9.5h9a6.5 6.5 0 0 1 0 13h-3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg></div>
        <div class="rv-btn rv-btn--del"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></div>
        <div class="rv-btn rv-btn--keep"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="m4.5 12.5 5 5L19.5 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div></div></div>
  </div>

  <div class="brandline"><img src="../assets/app_icon.png" alt="">拍簿 Pibook</div>
</div>
</body>
</html>
