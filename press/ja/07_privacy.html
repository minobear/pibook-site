<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截圖 07 — 隱私</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="../../assets/phone.css">
<link rel="stylesheet" href="../press.css">
<style>:root{--pb-sans:"Noto Sans JP", sans-serif;--pb-serif:"Noto Serif JP", serif}</style>
</head>
<body>
<div class="board board--coral">

  <div class="copy" style="height:306px;padding-top:46px">
    <div class="kicker">プライバシー</div>
    <h1>写真は<br>スマホの外に出ません</h1>
    <p class="sub">類似判定・顔検出・品質評価は<br>すべて端末の中で実行</p>
  </div>

  <div class="stage" style="top:306px;bottom:58px;flex-direction:column;align-items:center">
    <svg class="spark" style="left:16%;top:8%" width="24" height="24" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
    <svg class="spark" style="right:14%;top:2%" width="15" height="15" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>

    <img src="../../assets/mascot/pipi_locked.webp" alt="拍拍拎著掛鎖"
         style="width:min(206px,46vw);filter:drop-shadow(0 18px 32px rgba(42,55,68,.25))">

    <div class="checks">
      <div class="check-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#6DA890"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>サーバーに写真は一枚もありません<small>画像の分析はすべてこの端末で実行</small></div>
      </div>
      <div class="check-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#6DA890"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>顔検出で個人を特定しません<small>見ているのは鮮明さだけ</small></div>
      </div>
      <div class="check-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#6DA890"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>ログインなしですべて使えます<small>クラウドに残すのは整理の進み具合だけ</small></div>
      </div>
    </div>
  </div>

  <div class="brandline"><img src="../../assets/app_icon.png" alt="">Pibook</div>
</div>
<script src="../press.js"></script>
</body>
</html>
