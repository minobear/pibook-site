<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>App Preview 卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10161C; }
  body {
    font-family: "Noto Sans TC", system-ui, sans-serif;
    color: #F4F1EA;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    position: relative;
    width: 886px; height: 1920px;
    background: linear-gradient(168deg, #3C5B7A 0%, #24374C 46%, #16232F 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 66% 26% at 78% 8%, rgba(246,196,83,.20), transparent 70%),
      radial-gradient(ellipse 74% 32% at 14% 96%, rgba(232,128,110,.22), transparent 72%);
  }
  .inner { position: relative; z-index: 2; padding: 0 70px; }
  .icon {
    width: 176px; height: 176px; border-radius: 42px; display: block; margin: 0 auto 42px;
    box-shadow: 0 18px 46px -14px rgba(0,0,0,.7);
  }
  .wm {
    font-family: "Noto Serif TC", serif; font-weight: 700;
    font-size: 46px; letter-spacing: .04em; margin-bottom: 8px;
  }
  .latin {
    font-family: "Noto Serif TC", serif;
    font-size: 21px; letter-spacing: .42em; color: rgba(244,241,234,.55);
    margin-bottom: 56px;
  }
  h1 {
    font-family: "Noto Serif TC", serif; font-weight: 700;
    font-size: 68px; line-height: 1.42; letter-spacing: .02em;
  }
  h1 .hl { color: #F6C453; }
  .sub {
    margin-top: 30px; font-size: 29px; line-height: 1.8; color: rgba(244,241,234,.74);
  }
  .site {
    position: absolute; left: 0; right: 0; bottom: 74px; z-index: 2;
    font-family: "Noto Serif TC", serif; font-size: 25px; letter-spacing: .16em;
    color: rgba(244,241,234,.5);
  }
  .spark { position: absolute; z-index: 3; }
  /* 兩張卡用同一份版面，靠 body class 切換 */
  body:not(.end) .end-only { display: none; }
  body.end .start-only { display: none; }
</style>
</head>
<body class="end">
<div class="card">
  <svg class="spark" style="left:11%;top:16%" width="46" height="46" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
  <svg class="spark" style="right:13%;top:24%" width="28" height="28" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
  <svg class="spark" style="left:17%;bottom:22%" width="24" height="24" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>

  <div class="inner">
    <img class="icon" src="../../assets/app_icon.png" alt="">
    <div class="wm">拍簿</div>
    <div class="latin">PIBOOK</div>

    <div class="start-only">
      <h1>盡情拍、放心錄<br><span class="hl">整理</span>與<span class="hl">回憶</span>靠拍簿</h1>
    </div>
    <div class="end-only">
      <h1>照片<br>不離開你的手機</h1>
      <p class="sub">所有整理都在裝置上完成<br>不用登入也能完整使用</p>
    </div>
  </div>
  <div class="site">PIBOOK.APP</div>
</div>
</body>
</html>
