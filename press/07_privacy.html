<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截圖 07 — 隱私</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/phone.css">
<link rel="stylesheet" href="press.css">
</head>
<body>
<div class="board board--coral">

  <div class="copy" style="padding-top:64px">
    <div class="kicker">隱私</div>
    <h1>你的照片<br>不離開你的手機</h1>
    <p class="sub">相似比對、臉部偵測與品質評分<br>全部在裝置上完成</p>
  </div>

  <div class="stage" style="flex-direction:column;align-items:center;margin-top:8px">
    <svg class="spark" style="left:16%;top:8%" width="24" height="24" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
    <svg class="spark" style="right:14%;top:2%" width="15" height="15" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>

    <img src="../assets/mascot/pipi_locked.webp" alt="拍拍拎著掛鎖"
         style="width:min(236px,52vw);filter:drop-shadow(0 18px 32px rgba(42,55,68,.25))">

    <div class="checks">
      <div class="check-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#6DA890"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>伺服器上沒有你的任何照片<small>所有影像分析都在這台裝置上執行</small></div>
      </div>
      <div class="check-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#6DA890"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>臉部偵測不建立身分資料<small>只判斷清不清楚，不辨識是誰</small></div>
      </div>
      <div class="check-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#6DA890"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>不登入也能完整使用<small>雲端只備份整理進度，不碰照片</small></div>
      </div>
    </div>
  </div>

  <div class="brandline"><img src="../assets/app_icon.png" alt="">拍簿 Pibook</div>
</div>
<script src="press.js"></script>
</body>
</html>
