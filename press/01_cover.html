<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截圖 01 — 封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/phone.css">
<link rel="stylesheet" href="press.css">
</head>
<body>
<div class="board">

  <div class="brand-top">
    <img src="../assets/app_icon.png" alt="拍簿">
    <span class="wm">拍簿<small>PIBOOK</small></span>
  </div>

  <div class="copy" style="padding-top:22px">
    <h1>釋放快門自由<br>告別選片焦慮</h1>
    <p class="sub">相似挑選、壓縮、回憶 —— 全部在你的手機上完成</p>
  </div>

  <div class="stage">
    <svg class="spark" style="left:5%;top:3%" width="26" height="26" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
    <svg class="spark" style="right:6%;top:14%" width="17" height="17" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>

    <!-- 拍拍在左下角捧照片 -->
    <img class="mascot" src="../assets/mascot/pipi_showing.webp" alt="拍拍"
         style="left:-14px;bottom:2%;width:min(190px,45vw)">

    <div class="phone-fit"><div class="phone"><div class="scr">
      <div class="sb">
        <span>9:41</span>
        <svg width="64" height="14" viewBox="0 0 64 14" fill="currentColor"><rect y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="4" width="3" height="9" rx="1"/><rect x="15" y="2" width="3" height="11" rx="1"/><path d="M28 7a7.5 7.5 0 0 1 9.4 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M30.3 9.7a4 4 0 0 1 4.8 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="32.7" cy="12" r="1.3"/><rect x="45" y="2.5" width="16" height="9" rx="3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="47" y="4.5" width="9" height="5" rx="1.5"/><rect x="62" y="5.2" width="2" height="3.6" rx="1"/></svg>
      </div>

      <div class="hd">
        <div class="t">我的拍簿</div>
        <div class="m">24,318 張照片 · 已整理 62%</div>
        <div class="bar"><i></i></div>
      </div>

      <div class="today">
        <div class="kick">今天拍的還沒整理</div>
        <div class="big">38<small>張</small></div>
        <div class="sub">整理完今天就收工</div>
        <div class="cta">開始這一輪
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="m7.5 4 6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="stack">
          <div class="ph scene scene--blossom"></div>
          <div class="ph scene scene--latte"></div>
        </div>
        <img class="peek" src="../assets/mascot/pipi_peeking.webp" alt="">
      </div>

      <div class="sec-t">開始整理<span class="more">查看更多</span></div>

      <div class="tools">
        <div class="tool">
          <div class="ic ic--blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>
          <div class="tt">相似照片</div>
          <div class="tm">發現 <b>132</b> 張 · 佔 486 MB</div>
        </div>
        <div class="tool">
          <div class="ic ic--green"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 14 9 9l4 4 3-3 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="4" width="18" height="16" rx="3.4" stroke="currentColor" stroke-width="2"/></svg></div>
          <div class="tt">照片壓縮</div>
          <div class="tm">預估可省 <b>8.2 GB</b></div>
        </div>
        <div class="tool">
          <div class="ic ic--lav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3.2" stroke="currentColor" stroke-width="2"/><path d="m10 9.5 5 2.5-5 2.5Z" fill="currentColor"/></svg></div>
          <div class="tt">影片壓縮</div>
          <div class="tm">預估可瘦身 <b>3.1 GB</b></div>
        </div>
        <div class="tool">
          <div class="ic ic--coral"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="6" y="3" width="12" height="18" rx="2.6" stroke="currentColor" stroke-width="2"/><path d="M10 6.5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div class="tt">螢幕截圖</div>
          <div class="tm">共佔 412 MB</div>
        </div>
      </div>

      <div class="otd">
        <div class="ph scene scene--hill"></div>
        <div>
          <div class="tt">歷史今日</div>
          <div class="tm">3 年前的今天 · 6 張未整理</div>
        </div>
        <svg class="chev" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="m8 5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="nav">
        <div class="it on">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="13" height="15" rx="2.8" stroke="currentColor" stroke-width="2"/><path d="M8.5 3.5H18a2.5 2.5 0 0 1 2.5 2.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>整理</span>
        </div>
        <div class="it">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3.2" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="m5 17 4.5-4 3.5 3 3-2.6L20 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>圖庫</span>
        </div>
        <div class="it">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="2"/><path d="m10.2 9 5 3-5 3Z" fill="currentColor"/></svg>
          <span>回憶</span>
        </div>
        <div class="it">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 8h14l-1.2 12.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.6 10.5V6.8a3.4 3.4 0 0 1 6.8 0v3.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>印製</span>
        </div>
        <div class="it">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.4" r="3.6" stroke="currentColor" stroke-width="2"/><path d="M4.8 20.4a7.4 7.4 0 0 1 14.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>個人</span>
        </div>
      </div>
    </div></div></div>
  </div>
</div>
</body>
</html>
