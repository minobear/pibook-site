<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截圖 03 — 相似照片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/phone.css">
<link rel="stylesheet" href="press.css">
</head>
<body>
<div class="board">

  <div class="copy">
    <div class="kicker">相似照片</div>
    <h1>連拍裡<br>幫你挑出最好的那張</h1>
    <p class="sub">相像的排在一起，留哪幾張你決定</p>
  </div>

  <div class="stage">
    <svg class="spark" style="left:6%;top:4%" width="22" height="22" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>

    <!-- 拍拍舉放大鏡，從右側探進來 -->
    <img class="mascot" src="../assets/mascot/pipi_magnifier.webp" alt="拍拍"
         style="right:-24px;top:34%;width:min(150px,36vw);transform:rotate(-6deg)">

    <div class="phone-fit"><div class="phone"><div class="scr">
      <div class="sb">
        <span>9:41</span>
        <svg width="64" height="14" viewBox="0 0 64 14" fill="currentColor"><rect y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="4" width="3" height="9" rx="1"/><rect x="15" y="2" width="3" height="11" rx="1"/><path d="M28 7a7.5 7.5 0 0 1 9.4 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M30.3 9.7a4 4 0 0 1 4.8 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="32.7" cy="12" r="1.3"/><rect x="45" y="2.5" width="16" height="9" rx="3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="47" y="4.5" width="9" height="5" rx="1.5"/><rect x="62" y="5.2" width="2" height="3.6" rx="1"/></svg>
      </div>

      <div class="sm-hd">
        <div class="t">相似照片</div>
        <span class="chip">
          <svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="currentColor"/></svg>
          自動精選
        </span>
      </div>

      <div class="sm-group">
        <div class="row"><span class="tt">相似組 12</span><span class="sz">共 48.2 MB</span><span class="st">待清理 3</span></div>
        <div class="sm-thumbs">
          <div class="sm-th scene scene--dusk"><span class="best">最佳</span></div>
          <div class="sm-th scene scene--dusk" style="filter:brightness(.93) saturate(.9)"><span class="mark sel"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="sm-th scene scene--dusk" style="filter:brightness(1.05) blur(.6px)"><span class="mark sel"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="sm-th scene scene--dusk" style="filter:brightness(.88) blur(1px)"><span class="mark sel"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        </div>
      </div>

      <div class="sm-group">
        <div class="row"><span class="tt">相似組 13</span><span class="sz">共 31.6 MB</span><span class="st">待清理 3</span></div>
        <div class="sm-thumbs">
          <div class="sm-th scene scene--sea"><span class="best">最佳</span></div>
          <div class="sm-th scene scene--sea" style="filter:brightness(.94)"><span class="mark sel"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="sm-th scene scene--sea" style="filter:brightness(1.06) saturate(.85)"><span class="mark sel"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="sm-th scene scene--sea" style="filter:brightness(.9) blur(.6px)"><span class="mark sel"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        </div>
      </div>

      <div class="sm-group">
        <div class="row"><span class="tt">相似組 14</span><span class="sz">共 22.9 MB</span><span class="st" style="color:var(--pb-success-deep)">全部保留</span></div>
        <div class="sm-thumbs">
          <div class="sm-th scene scene--latte"><span class="best">最佳</span></div>
          <div class="sm-th scene scene--latte" style="filter:brightness(.95)"><span class="mark"></span></div>
          <div class="sm-th scene scene--latte" style="filter:brightness(1.05) saturate(.9)"><span class="mark"></span></div>
          <div class="sm-th scene scene--latte" style="filter:brightness(.9) blur(.5px)"><span class="mark"></span></div>
        </div>
      </div>

      <div class="sm-cta">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#fff"/></svg>
        挑最佳 · 還有 8 組
      </div>
    </div></div></div>
  </div>

  <div class="brandline"><img src="../assets/app_icon.png" alt="">拍簿 Pibook</div>
</div>
</body>
</html>
