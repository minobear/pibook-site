<!DOCTYPE html>

<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="board board--emerald">

  <div class="copy">
    <div class="kicker" style="color:var(--pb-success-deep)">照片與影片壓縮</div>
    <h1>影片最吃空間<br>也最容易瘦下來</h1>

  </div>

  <div class="stage stage--panel" style="margin-top:30px">
    <svg class="spark" style="right:6%;top:-2%" width="22" height="22" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
    <svg class="spark" style="left:6%;top:48%" width="15" height="15" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z" fill="#F6C453"/></svg>
    <div class="uipanel">
      <img src="../assets/shots/compress_sq_hd.jpg" alt="影片壓縮：三檔品質與每一部能省下多少">
    </div>
    <div class="float-chip" style="position:relative;margin-top:-22px;z-index:6">
      <span class="dot" style="background:var(--pb-success-deep)"></span>
      省下 2.03 GB · −96%
    </div>
  </div>

  <div class="brandline"><img src="../assets/app_icon.png" alt="">拍簿 Pibook</div>
